name: Deploy course site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r 01-getting-started 02-language 03-ecosystem 04-real-world 05-capstone 06-reference _site/
          cp README.md LICENSE _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
